name: Build
# يختبر منطق التطبيق (FavCore) ثم يبني تطبيق الآيفون ويخرج IPA غير موقَّع (يُثبَّت بـ AltStore) في Release ثابت «latest».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Unit tests (FavCore)
        run: |
          set -o pipefail
          swift test --package-path Packages/FavCore 2>&1 | tail -120

  ios:
    needs: core
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build for the iPhone (no code signing)
        run: |
          set -o pipefail
          xcodebuild -project Favorites.xcodeproj -scheme Favorites -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="3.0.$BUILD_NUMBER" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | grep -E "error:|warning: .*(deprecated|never)|BUILD (SUCCEEDED|FAILED)" | head -80
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload dist
          cp -R build/Build/Products/Release-iphoneos/Favorites.app Payload/
          zip -qry dist/Favorites-native.ipa Payload
          ls -la dist
      - uses: actions/upload-artifact@v4
        with: { name: ipa, path: dist/Favorites-native.ipa, if-no-files-found: error }

  release:
    needs: [core, ios]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish to the fixed "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="Build 3.0.$BUILD_NUMBER · commit ${GITHUB_SHA::7} · unsigned IPA for AltStore (not verified on a device by CI)"
          gh release view latest >/dev/null 2>&1 || gh release create latest --target "$GITHUB_SHA" --title "Favorites native" --notes "$NOTES"
          gh release upload latest dist/* --clobber
          gh release edit latest --title "Favorites native · 3.0.$BUILD_NUMBER" --notes "$NOTES" --latest
