<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="80%">
      <stop offset="0" stop-color="#3a1424"/>
      <stop offset="0.55" stop-color="#1c0f1c"/>
      <stop offset="1" stop-color="#0f0d14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d9a4"/>
      <stop offset="0.5" stop-color="#dbb36b"/>
      <stop offset="1" stop-color="#b9824f"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f07a92"/>
      <stop offset="1" stop-color="#c7405f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- شريط علامة (مكتبة/حفظ) -->
  <g filter="url(#shadow)">
    <path d="M332 176 H692 a40 40 0 0 1 40 40 V858 L512 716 L292 858 V216 a40 40 0 0 1 40 -40 Z" fill="url(#gold)"/>
    <path d="M332 176 H692 a40 40 0 0 1 40 40 V250 H292 V216 a40 40 0 0 1 40 -40 Z" fill="#ffffff" opacity="0.14"/>
  </g>
  <!-- قلب (المفضلة) -->
  <g filter="url(#glow)">
    <path d="M512 590 C 400 510, 372 452, 372 404 C 372 352, 412 314, 460 314 C 488 314, 502 326, 512 344 C 522 326, 536 314, 564 314 C 612 314, 652 352, 652 404 C 652 452, 624 510, 512 590 Z" fill="url(#rose)"/>
  </g>
  <!-- بريق -->
  <path d="M640 300 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 Z" fill="#fff6e0" opacity="0.9"/>
</svg>
