# مشروع Xcode يُولَّد على GitHub Actions (macOS) بأداة XcodeGen — لا حاجة لجهاز ماك.
name: Favorites
options:
  bundleIdPrefix: com.favlib
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
packages:
  FavCore:
    path: Packages/FavCore
targets:
  Favorites:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: FavCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.favlib.favoritesnative
        PRODUCT_NAME: Favorites
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "المفضلة"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: NO
    scheme:
      testTargets: []
